<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MBRG — Map Battle Royale</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h1>MBRG</h1>
        <p class="subtitle">Map Battle Royale</p>
        <section id="controls">
          <h2>Partida</h2>
          <div class="row">
            <button id="btn-play" type="button" title="Reproducir / Pausar">▶</button>
            <button id="btn-restart" type="button" title="Reiniciar">↺</button>
            <span id="round-label" class="round-label">—</span>
          </div>
          <label class="speed">
            <span>Velocidad: <strong id="speed-label">500 ms</strong></span>
            <input id="speed" type="range" min="0" max="4" step="1" value="2" />
          </label>
          <div class="seed-row">
            <label for="seed">Semilla</label>
            <input id="seed" type="number" step="1" />
            <button id="btn-seed" class="btn-wide" type="button">Aplicar</button>
          </div>
        </section>
        <section id="log">
          <h2>Eventos</h2>
          <ol id="log-list"></ol>
        </section>
        <section id="stats">
          <h2>Estadísticas</h2>
          <div id="stats-body"></div>
        </section>
      </aside>
      <main id="stage">
        <div id="map-wrap">
          <canvas id="map"></canvas>
          <div id="zoom-controls">
            <button id="btn-zoom-in" type="button" title="Acercar (rueda del ratón)">＋</button>
            <button id="btn-zoom-out" type="button" title="Alejar (rueda del ratón)">−</button>
            <button id="btn-zoom-fit" type="button" title="Ajustar al mapa">⛶</button>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
