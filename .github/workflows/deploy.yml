name: Deploy

# Publica el visor en GitHub Pages y, antes, verifica que el código está sano.
# La URL sale de la pestaña Settings → Pages → Build and deployment →
# Source: "GitHub Actions" (hay que hacerlo una vez a mano, la primera vez).

on:
  push:
    branches: [main]
  pull_request:

# Permiso mínimo:contents (leer) y pages:write solo al desplegar.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Build y deploy en Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Enable the Pages site if it is off instead of failing: a fresh repo
          # has none until someone flips the switch in Settings (or this runs).
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
