<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MBRG — Map Battle Royale</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h1>MBRG</h1>
        <p class="subtitle">Map Battle Royale</p>
        <p class="meta">
          <select id="lang" data-i18n-title="match.language" title="Idioma">
            <option value="es">Español</option>
            <option value="en">English</option>
          </select>
          <span class="version" id="app-version" data-i18n-title="match.version" title="Versión en ejecución"></span>
        </p>
        <section id="controls">
          <h2 data-i18n="match.title">Partida</h2>
          <div class="row">
            <button id="btn-play" type="button" data-i18n-title="match.play" title="Reproducir / Pausar">▶</button>
            <button id="btn-restart" type="button" data-i18n-title="match.restart" title="Reiniciar">↺</button>
            <span id="round-label" class="round-label">—</span>
          </div>
          <label class="speed">
            <span data-i18n="match.speed">Velocidad:</span> <strong id="speed-label">500 ms</strong></span>
            <input id="speed" type="range" min="0" max="4" step="1" value="2" />
          </label>
          <div class="seed-row">
            <label for="seed" data-i18n="match.seed">Semilla</label>
            <input id="seed" type="number" step="1" />
            <button id="btn-seed" class="btn-wide" type="button" data-i18n="match.apply">Aplicar</button>
          </div>
        </section>
        <section id="log">
          <h2 data-i18n="log.title">Eventos</h2>
          <ol id="log-list"></ol>
        </section>
        <section id="stats">
          <h2 data-i18n="stats.title">Estadísticas</h2>
          <div id="stats-body"></div>
        </section>
      </aside>
      <main id="stage">
        <div id="map-wrap">
          <canvas id="map"></canvas>
          <div id="zoom-controls">
            <button id="btn-zoom-in" type="button" data-i18n-title="match.zoomIn" title="Acercar (rueda del ratón)">＋</button>
            <button id="btn-zoom-out" type="button" data-i18n-title="match.zoomOut" title="Alejar (rueda del ratón)">−</button>
            <button id="btn-zoom-fit" type="button" data-i18n-title="match.zoomFit" title="Ajustar al mapa">⛶</button>
          </div>
          <canvas id="minimap" data-i18n-title="match.minimap" title="Minimapa — clic para centrar la vista"></canvas>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
